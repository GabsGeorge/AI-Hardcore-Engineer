    expired_at: 2026-12-15
  - id: GHSA-v6wh-96g9-6wx3
    statement: launch-editor NTLMv2 disclosure. Dev-only, so em Windows. CI roda Linux.
    expired_at: 2026-12-15
  - id: GHSA-698v-4r3x-3vcv
    statement: launch-editor escapeCmdArgs no Windows. Dev-only. CI roda Linux.
    expired_at: 2026-12-15
  - id: GHSA-r825-w8mm-5pxw
    statement: launch-editor CLI flag misinterpretation. Dev-only. CI roda Linux.
    expired_at: 2026-12-15
  - id: GHSA-587h-7wmj-h5pm
    statement: launch-editor fs.existsSync bypass Windows. Dev-only. CI roda Linux.
    expired_at: 2026-12-15
  - id: GHSA-9jrq-w75r-8gcw
    statement: vite cross-origin via middleware. Dev-only. Prod usa nginx estatico.
