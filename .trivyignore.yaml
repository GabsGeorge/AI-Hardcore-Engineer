    statement: tinypool prototype pollution. Dev-only (vitest worker pool). Sem exposicao prod.
    expired_at: 2026-12-15
  - id: GHSA-85c8-ppgw-ccpr
    statement: tinypool prototype pollution em run(). Dev-only. Sem exposicao prod.
    expired_at: 2026-12-15
