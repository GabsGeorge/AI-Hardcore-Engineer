title = "getnet-support gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Only the empty .env template and the auth test fixtures are allowed to look like secrets"
paths = [
    '''^\.env\.example$''',
    # Integration and security tests exercise register/login/reset paths with throwaway
    # strings. gitleaks matches them as generic api keys; the values are literal fixtures
    # inside the repo, not real credentials.
    '''^tests/integration/test_auth_.*\.py$''',
    '''^tests/integration/test_me_delete_account\.py$''',
    '''^tests/security/test_auth_enumeration\.py$''',
]
