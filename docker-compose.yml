# docker compose up -d --build   (copy .env.example to .env and fill it first)
x-app-env: &app-env
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-}@postgres:5432/app
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest:
    build: { context: ., target: runtime }
    <<: *app-env
    command: ["python", "-m", "app.rag.ingest"]
    volumes:
      - models-cache:/home/app/.cache
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: runtime }
    <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - models-cache:/home/app/.cache
    depends_on:
      ingest: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # --- Perfil `obs`: observabilidade (prometheus, grafana) -------------------------------
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_started }

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus: { condition: service_started }

  # --- Perfil `load`: carga sintética com k6 -----------------------------------------------
  k6:
    profiles: ["load"]
    image: grafana/k6:latest
    environment:
      BASE_URL: http://api:8000
      AUTH_TOKEN: ${K6_AUTH_TOKEN:-}
    volumes:
      - ./deploy/k6:/scripts:ro
    entrypoint: ["k6"]
    command: ["run", "/scripts/chat.js"]
    depends_on:
      api: { condition: service_started }

  # --- Perfil `eval`: golden set e retrieval com o modelo real (gasta tokens) --------------
  eval:
    profiles: ["eval"]
    build: { context: ., target: runtime }
    <<: *app-env
    volumes:
      - ./evals:/app/evals:ro
      - models-cache:/home/app/.cache
    command: ["python", "evals/run_eval.py"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  models-cache:
  prometheus-data:
  grafana-data:
