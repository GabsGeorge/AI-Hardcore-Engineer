# Public Getnet content indexed by `python -m app.rag.ingest` (REQ-RAG-01, research R-17).
# Only hosts under `allowed_domains` (and their subdomains) are fetched, always over https and
# only where robots.txt allows. Seeds are curated because parts of the site are rendered by JS
# and the sitemap is incomplete; together they cover the 10 golden-set scenarios.
# English content comes from the regional Santander Getnet portal (getnet.net/en). It is
# shallower than the Brazilian site but covers in-person, online, omnichannel, value-added
# and the SEP e-commerce API — enough for EN queries to land without relying only on PT↔EN
# rewrite (REQ-RAG-05). PT-specific products (Pix, antecipação, crediário) still fall back
# to the PT corpus via the query rewrite path.
allowed_domains:
  - getnet.com.br
  - getnet.net

max_pages: 150

seeds:
