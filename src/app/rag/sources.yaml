# capturadas com um navegador (scripts/capture_offers.mjs -> scripts/build_curated_offers.py) e
# guardadas em curated/. A URL citada ao lojista aponta para a seção da página.
curated:
  - path: todas-as-maquininhas.md
    url: https://site.getnet.com.br/todas-as-maquininhas/#offers-card
