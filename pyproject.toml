[project]
name = "getnet-support"
version = "0.1.0"
description = "Getnet multi-agent support system (FastAPI + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    "pyjwt>=2.9",
    "tenacity>=9.0",
    "bm25s>=0.2",
    "flashrank>=0.2",
    "ddgs>=9.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
    "sse-starlette>=2.1",
    "argon2-cffi>=23.1",
    "aiosmtplib>=3.0",
    "python-ulid>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "schemathesis>=3.38",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]
eval = ["ragas>=0.2"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:cacheprovider --strict-markers"
markers = ["req(*ids): requirement IDs covered by the test (REQ-...)"]

[tool.coverage.run]
source = ["src/app"]
data_file = "/tmp/.coverage"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", ".specify", "docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
