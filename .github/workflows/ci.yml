name: ci

on:
  push:
    branches: [main, 001-multi-agent-support]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests ruff check src tests scripts
      - name: ruff format --check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests ruff format --check src tests scripts
      - name: mypy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests mypy

  tests:
    name: tests (pytest + no-stubs + traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pytest suite (rede isolada)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests pytest --maxfail=1
      - name: no stubs em src/ (constitution V)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests pytest tests/test_no_stubs.py tests/test_readme.py
      - name: rastreabilidade REQ → task → teste
        # Bloqueante: todo REQ marcado como entregue precisa de pelo menos um teste
        # associado (@pytest.mark.req). Falhar aqui vira defeito de rastreabilidade,
        # nao item informativo.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests python scripts/check_traceability.py

  web-lint:
    name: web-lint (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: web-lint
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-lint

  web-tests:
    name: web-tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vitest
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-tests

  web-build:
    name: web-build (vite production bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vite build
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-build

  compose-build:
    name: compose-build (todos os serviços)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        # Garante que todas as imagens (api, web, ingest, tests, k6, …) sobem num clone zero.
        # Pega regressões como o node_modules indo pro build context do web (item 1).
        run: docker compose build

  web-e2e:
    name: web-e2e (playwright + mailpit, rede isolada)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: playwright e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-e2e

  # Nota: a11y (axe-core) já roda dentro do web-e2e pelo spec `01-register-login` —
  # não precisa de job separado.

  secrets:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: lock (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: uv lock está em dia
        run: uv lock --check

  trivy-fs:
    name: trivy (fs scan — SPA + raiz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # SPA: deps do package-lock vs CVEs conhecidos.
      # Pinamos por SHA (nao por tag) para que o CI nao pegue uma retag silenciosa.
      - name: trivy fs apps/web
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: apps/web
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
      # Raiz: pyproject + uv.lock + Dockerfiles.
      - name: trivy fs raiz (python + docker)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: apps/web,node_modules
          format: sarif
          output: trivy-root.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
