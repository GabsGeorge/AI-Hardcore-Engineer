# Single-origin proxy: /v1/* goes to the API, everything else serves the SPA.
# Running on port 80 as a non-root user (see apps/web/Dockerfile).

upstream api_upstream {
  server api:8000 max_fails=3 fail_timeout=30s;
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  # The /metrics endpoint of the API stays on an internal port (9100); never proxy here.
  location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

  # Security headers: no HTML embedding other than our own, no sniff, basic CSP.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Server-Sent Events: never buffer or compress.
  location ~ ^/v1/(chat/stream|conversations/.+/events)$ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 30m;
  }

  # API proxy (everything under /v1/).
  location /v1/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA: hashed assets get long cache; HTML stays fresh.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /brand/ {
    root /usr/share/nginx/html;
    expires 7d;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
